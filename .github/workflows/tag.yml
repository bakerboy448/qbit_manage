name: Tag New Version

on:
  push:
    branches: [ master ]

concurrency:
  group: tag-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:

      - uses: actions/checkout@v6
        with:
          # Prefer a PAT so the tag push triggers the downstream `v*` tag workflows
          # (version.yml / pypi-publish.yml). Fall back to GITHUB_TOKEN so forks
          # without a PAT secret still create the tag instead of hard-failing with
          # "Input required and not supplied: token". (Downstream tag workflows are
          # not triggered by a GITHUB_TOKEN-pushed tag — set a PAT secret for those.)
          token: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 2

      # Pinned per supply-chain hygiene; bump SHA on next dependabot review
      - uses: Kometa-Team/tag-new-version@1dd1fb186f3f5229331e8ddf6515288633a2412e
        with:
          version-command: |
            cat VERSION
